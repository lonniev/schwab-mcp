name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for tollbooth-dpyc on PyPI
        run: |
          REQUIRED=$(grep 'tollbooth-dpyc' pyproject.toml | grep -oP '==\K[0-9.]+')
          if [ -n "$REQUIRED" ]; then
            echo "Waiting for tollbooth-dpyc==$REQUIRED on PyPI..."
            for i in $(seq 1 30); do
              if pip index versions tollbooth-dpyc 2>/dev/null | grep -q "$REQUIRED"; then
                echo "Found tollbooth-dpyc==$REQUIRED on PyPI"
                break
              fi
              echo "Attempt $i/30 — not yet available, waiting 10s..."
              sleep 10
            done
          fi

      # CI installs from pyproject.toml; Horizon builds with `uv sync --frozen`,
      # which installs uv.lock VERBATIM. Nothing compared the two, so a pin bumped
      # in pyproject with a stale lock goes green here and dies at deploy with a
      # ModuleNotFoundError — as excalibur-mcp's did on 2026-07-31. This is the
      # missing comparison.
      - name: Lockfile matches pyproject
        uses: astral-sh/setup-uv@v7
      - run: uv lock --check

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -v
