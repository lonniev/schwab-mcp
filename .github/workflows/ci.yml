name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Wait for tollbooth-dpyc on PyPI
        run: |
          REQUIRED=$(grep 'tollbooth-dpyc' pyproject.toml | grep -oP '==\K[0-9.]+')
          if [ -n "$REQUIRED" ]; then
            echo "Waiting for tollbooth-dpyc==$REQUIRED on PyPI..."
            for i in $(seq 1 30); do
              if pip index versions tollbooth-dpyc 2>/dev/null | grep -q "$REQUIRED"; then
                echo "Found tollbooth-dpyc==$REQUIRED on PyPI"
                break
              fi
              echo "Attempt $i/30 — not yet available, waiting 10s..."
              sleep 10
            done
          fi

      - uses: astral-sh/setup-uv@v9.0.0

      # Install from uv.lock — the SAME artifact Horizon builds from (its config
      # reads `Dependencies: uv.lock` and runs `uv sync --frozen`), so CI tests
      # byte-identical dependencies to the container rather than a second,
      # independently-resolved set.
      #
      # `pip install -e ".[dev]"` resolved pyproject.toml instead. Two sources,
      # never compared — which is how excalibur-mcp went green on 2026-07-31 with
      # pyproject at tollbooth-dpyc 0.77.0 and its lock at 0.76.0, then failed
      # three Horizon builds on `No module named 'tollbooth.oauth_situation'`.
      # Schwab had the identical stale lock and would have followed it down.
      #
      # `--locked` also asserts the lock is up to date with pyproject, so drift
      # fails pre-merge rather than at deploy.
      - name: Install dependencies (the lockfile Horizon deploys)
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest tests/ -v

      - name: Entrypoint inspects (the check Horizon performs at build time)
        run: |
          [ -f fastmcp.json ] || { echo "no fastmcp.json — not a FastMCP deployment; skipping"; exit 0; }
          ENTRY=$(python -c "import json;print(json.load(open('fastmcp.json'))['server'])")
          case "$ENTRY" in *:*) TARGET="$ENTRY";; *) TARGET="$ENTRY:mcp";; esac
          echo "inspecting $TARGET"
          if [ -f uv.lock ] && command -v uv >/dev/null 2>&1; then
            uv run fastmcp inspect -f fastmcp -o /tmp/server-info.json "$TARGET"
          else
            fastmcp inspect -f fastmcp -o /tmp/server-info.json "$TARGET"
          fi
